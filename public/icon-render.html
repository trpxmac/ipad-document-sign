<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: transparent; display: flex; justify-content: center; align-items: center; width: 180px; height: 180px; }
  svg { width: 180px; height: 180px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
    <filter id="penShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="5" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- iOS App Icon Background -->
  <rect width="180" height="180" fill="url(#bg)" />
  
  <!-- Document Base -->
  <path d="M 40 25 h 70 l 30 30 v 90 c 0 5.5 -4.5 10 -10 10 h -90 c -5.5 0 -10 -4.5 -10 -10 v -110 c 0 -5.5 4.5 -10 10 -10 z" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Folded Corner -->
  <path d="M 110 25 v 20 c 0 5.5 4.5 10 10 10 h 20 z" fill="#e2e8f0" />
  
  <!-- Siriroj Cross on Document -->
  <!-- Cross Size: 44x44. Center X=85, Y=65 -->
  <rect x="79" y="43" width="12" height="44" fill="#002d74" />
  <rect x="91" y="59" width="16" height="12" fill="#002d74" />
  <rect x="63" y="59" width="16" height="12" fill="#b12028" />

  <!-- Document Lines (Text) -->
  <rect x="50" y="100" width="60" height="4" rx="2" fill="#cbd5e1" />
  <rect x="50" y="112" width="45" height="4" rx="2" fill="#cbd5e1" />
  
  <!-- Signature Curve (Blue Ink) -->
  <path d="M 65 135 C 75 115, 85 145, 105 125" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />

  <!-- Apple Pencil -->
  <!-- Positioned signing the curve -->
  <g transform="translate(108, 122) rotate(-35)" filter="url(#penShadow)">
    <!-- Tip -->
    <path d="M 0 0 L -6 -15 L 6 -15 Z" fill="#94a3b8" />
    <path d="M 0 0 L -2 -5 L 2 -5 Z" fill="#334155" />
    <!-- Body -->
    <rect x="-6" y="-95" width="12" height="80" rx="2" fill="#f8fafc" />
    <!-- Metallic Band -->
    <rect x="-6" y="-80" width="12" height="3" fill="#cbd5e1" />
    <!-- Cap -->
    <rect x="-5" y="-100" width="10" height="5" rx="2" fill="#e2e8f0" />
  </g>
</svg>
</body>
</html>
